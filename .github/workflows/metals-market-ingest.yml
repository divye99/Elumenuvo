name: Metals market ingest (MCX + LME copper)

# Feeds the INTERNAL reference series in Supabase (metal_market_ticks/_daily)
# by hitting the CRON_SECRET-protected ingest routes. Two cadences:
#   - MCX (Angel One, free): every 15 min during MCX hours, Mon-Fri
#     ("*/15 3-17 * * 1-5" UTC ~ 8:30 am to 11:15 pm IST).
#   - LME (metals.dev free tier, 100 req/month): twice per weekday
#     (08:40 / 16:40 UTC, inside LME trading hours) ~ 44 calls/month.
# Jobs are routed by which cron fired; a manual run triggers both.
#
# Both routes no-op gracefully (HTTP 200 with "skipped") until their provider
# keys are set, so this workflow is safe to run before those accounts exist.
# Requires the repo secret CRON_SECRET = the Vercel Production value.
on:
  schedule:
    - cron: "*/15 3-17 * * 1-5"
    - cron: "40 8,16 * * 1-5"
  workflow_dispatch: {}

jobs:
  mcx:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 3-17 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - name: Ingest MCX copper snapshot
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is empty here. Add it as a REPOSITORY secret with the exact value from Vercel (Production)."
            exit 1
          fi
          code=$(curl -sS -o /tmp/mcx.txt -w '%{http_code}' --retry 2 --retry-delay 30 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://elumenuvo.com/api/cron/ingest-mcx")
          echo "HTTP $code"; cat /tmp/mcx.txt || true; echo
          if [ "$code" = "401" ]; then
            echo "::error::401 - this repo's CRON_SECRET does not match Vercel Production."
            exit 1
          fi
          [ "$code" = "200" ] || { echo "::error::Unexpected HTTP $code from /api/cron/ingest-mcx."; exit 1; }

  lme:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '40 8,16 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - name: Ingest LME copper snapshot
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is empty here. Add it as a REPOSITORY secret with the exact value from Vercel (Production)."
            exit 1
          fi
          code=$(curl -sS -o /tmp/lme.txt -w '%{http_code}' --retry 2 --retry-delay 30 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://elumenuvo.com/api/cron/ingest-lme")
          echo "HTTP $code"; cat /tmp/lme.txt || true; echo
          if [ "$code" = "401" ]; then
            echo "::error::401 - this repo's CRON_SECRET does not match Vercel Production."
            exit 1
          fi
          [ "$code" = "200" ] || { echo "::error::Unexpected HTTP $code from /api/cron/ingest-lme."; exit 1; }
